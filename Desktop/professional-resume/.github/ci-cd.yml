name: Build and push on ECR
on:
    push:
        #pull_request
         #branches:['main','dev']
        branches: [' main']

jobs:
    build_scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v7
            - name: trivy scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs' 
                severity: HIGH,CRITICAL
                exit-code: 1
            - name: Build Docker Image
              run: docker build -t 210911974624.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest .
              
            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                severity: HIGH,CRITICAL
                exit-code: 1
            
            - name: Scan image with Trivy 
              uses: aquasecurity/trivy-action@0.36.0 
              with: 
                image-ref: 210911974624.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest
                format: table 
                exit-code: 1 
                ignore-unfixed: true 
                severity: CRITICAL,HIGH

            - name: Push image to Ecr
              run: echo "push"
               
              