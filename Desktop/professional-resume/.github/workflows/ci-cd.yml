name: Build and push on ECR
on:
    push:
        #pull_request
         #branches:['main','dev']
        branches: [' main']
permissions :
  id-token: write
  contents: read
jobs:
    build_scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v7
            - name: trivy scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs' 
                severity: HIGH,CRITICAL
                exit-code: 0
            - name: Build Docker Image
              run: docker build -t 210911974624.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest .
          
            - name: Scan image with Trivy 
              uses: aquasecurity/trivy-action@v0.36.0 
              with: 
                image-ref: 210911974624.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest
                format: table 
                exit-code: 0
                ignore-unfixed: true 
                severity: CRITICAL,HIGH

            - name: Push image to Ecr
              run: echo "push"
               
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
              with:
                role-to-assume: arn:aws:iam::210911974624:role/github-action-role
                aws-region: aws-region-1 
            - name: log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2